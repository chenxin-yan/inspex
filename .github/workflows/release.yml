name: Release

on:
  push:
    branches:
      - main
    paths:
      - ".changeset/**"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "mise.toml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/actions/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Reset at the top; each job declares exactly what it needs. Only `publish`
# gets id-token: write (npm trusted publishing).
permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  select-mode:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup runtimes
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup runtimes
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: node pnpm
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Version the package and update the release PR
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-title: "chore: release"
          commit-message: "chore: version package"
          script: pnpm run release:version

  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.tarball.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup runtimes
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: node pnpm
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build and lifecycle hooks run without publishing credentials or restored caches.
      - name: Build and pack
        run: |
          pnpm run build
          pnpm run release:pack "$RUNNER_TEMP/release-pack"

      - name: Upload release tarball
        id: tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-pack-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-pack
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency installation, builds, or lifecycle hooks in this job.
      # npm >=11.5.1 uses OIDC; the package needs a trusted publisher for release.yml
      # on npmjs.com, which can only be set up after a first publication by hand.
      - name: Setup runtimes
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: node
          cache: false

      - name: Download release tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.pack.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-pack

      - name: Publish
        # Call Node directly: `pnpm run` installs missing dependencies, with lifecycle scripts, first.
        run: node scripts/release.mjs --publish-dir "$RUNNER_TEMP/release-pack"

  finalize:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup runtimes
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: node pnpm
          cache: false

      - name: Install Changesets without lifecycle hooks
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Tag the version even when a retry found it already uploaded.
      - name: Create the tag and GitHub release
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm run changeset git-tag
